services:
  - type: web
    name: site-actere
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.api:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: actere-db
          property: connectionString

databases:
  - name: actere-db
    plan: free
    databaseName: actere_db
    user: actere_user
